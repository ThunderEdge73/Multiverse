[manifest]
version = "1.0.0"
priority = 0
dump_lua = true

[[patches]]
[patches.pattern]
target = "functions/UI_definitions.lua"
pattern = '''
if AUT.card_type == 'Enhanced' then card_type = localize{type = 'name_text', key = card.config.center.key, set = 'Enhanced'} end
'''
position = "after"
payload = '''
if AUT.card_type == 'mul_Skill' then card_type = localize{type = 'name_text', key = card.config.center.key, set = 'mul_Skill'} end
'''
match_indent = true

[[patches]]
[patches.pattern]
target = "functions/button_callbacks.lua"
pattern = '''
elseif card.ability.set == 'Enhanced' or card.ability.set == 'Default' then
'''
position = "at"
payload = '''
elseif card.ability.set == 'Enhanced' or card.ability.set == 'Default' or card.ability.set == "mul_Skill" then
'''
match_indent = true

[[patches]]
[patches.pattern]
target = "functions/common_events.lua"
pattern = '''
elseif _type == 'Edition' then _pool[#_pool + 1] = "e_foil"
'''
position = "after"
payload = '''
elseif _type == "mul_Skill" then _pool[#_pool + 1] = "sk_mul_strike"
'''
match_indent = true