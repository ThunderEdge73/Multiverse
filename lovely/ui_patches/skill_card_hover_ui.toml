[manifest]
version = "1.0.0"
priority = 0
dump_lua = true

[[patches]]
[patches.pattern]
target = "functions/UI_definitions.lua"
pattern = '''
if AUT.card_type == 'Enhanced' then card_type = localize{type = 'name_text', key = card.config.center.key, set = 'Enhanced'} end'''
position = "after"
payload = '''
if AUT.card_type == 'mul_Skill' then card_type = localize{type = 'name_text', key = card.config.center_key, set = 'mul_Skill'} end
'''
match_indent = true

[[patches]]
[patches.pattern]
target = "functions/button_callbacks.lua"
pattern = '''
elseif card.ability.set == 'Enhanced' or card.ability.set == 'Default' then
'''
position = "at"
payload = '''
elseif card.ability.set == 'Enhanced' or card.ability.set == 'Default' or card.ability.set == "mul_Skill" then
'''
match_indent = true

[[patches]]
[patches.pattern]
target = '''=[SMODS _ "src/utils.lua"]'''
pattern = '''
local desc_scale = (thunk.font or G.LANG.font).DESCSCALE
'''
position = "before"
payload = '''
if args.set == "mul_Skill" and not part.control.f then
    thunk.font = SMODS.Fonts["mul_kreon"]
end
'''
match_indent = true